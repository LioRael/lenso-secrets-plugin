name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-repository-boundary.sh
      - run: cargo fmt --all -- --check
      - name: Check generated contracts
        run: |
          cargo install --locked --version '=0.7.4' lenso-contract-codegen
          lenso-contract-codegen workspace check --manifest-path Cargo.toml
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Package public crates
        run: |
          cargo package --locked -p lenso-capability-secrets
          cargo package --locked --list -p lenso-secrets-env-plugin
          cargo package --locked --list -p lenso-secrets-keychain-plugin
          cargo package --locked --list -p lenso-secrets-encrypted-file-plugin
          cargo package --locked --list -p lenso-secrets-command-plugin

  workers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.5.0
      - run: pnpm --dir workers install --frozen-lockfile
      - run: cargo clippy --locked -p lenso-secrets-env-plugin -p lenso-secrets-workers-smoke --features lenso-secrets-env-plugin/workers --target wasm32-unknown-unknown -- -D warnings
      - run: cargo package --locked -p lenso-secrets-env-plugin --features workers --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: bash workers/build.sh
      - run: node workers/proof.mjs

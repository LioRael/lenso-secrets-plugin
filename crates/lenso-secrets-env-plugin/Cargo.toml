[package]
name = "lenso-secrets-env-plugin"
version = "0.1.8"
description = "Allowlisted environment-backed Secrets Provider Plugin for Lenso."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso]
plugin-id = "lenso.secrets.env"
root-slot = "secrets"

[features]
default = []
workers = ["dep:js-sys", "dep:wasm-bindgen"]

[dependencies]
js-sys = { version = "=0.3.104", optional = true }
wasm-bindgen = { version = "=0.2.127", optional = true }
futures.workspace = true
lenso-capability-secrets = { version = "0.1.4", path = "../lenso-capability-secrets" }
lenso-kernel = "0.3.6"
lenso-native-adapter = "0.3.14"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
lenso-app-plan.workspace = true

[lints]
workspace = true
